# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Built against the latest cushion snapshot (26.3-snapshot-7). The mod only calls
# API that is byte-identical across every cushion snapshot (26.3-snapshot-3
# onward) — the one method whose name changed (the cushion support check) is
# reimplemented locally, and the cosmetic swing call was dropped — so the same
# build works on all of them. fabric.mod.json depends on the whole 26.3 range.
minecraft_version=26.3-snapshot-7
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=dev.tggamesyt

# Dependencies
fabric_api_version=0.156.2+26.3
